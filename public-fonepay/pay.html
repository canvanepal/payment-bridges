<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pay by QR · Fonepay</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
  :root {
    --bg: #100e0d;
    --panel: #191514;
    --line: #241e1c;
    --line-2: #332a27;
    --text: #eae4e1;
    --muted: #9c8f8a;
    --faint: #6b5f5a;
    --accent: #cf4b33;
    --accent-line: #6d3125;
    --npr: #e8a58f;
    --ok: #3fae7c;
    --warn: #d3a154;
    --bad: #d0615a;
    --shadow: 0 28px 64px -28px rgba(14, 6, 4, .9);
    --sans: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  :root[data-theme='light'] {
    --bg: #f8f6f5;
    --panel: #ffffff;
    --line: #e7e2e0;
    --line-2: #d6cfcc;
    --text: #1f1715;
    --muted: #6a5c57;
    --faint: #948782;
    --accent: #b23c25;
    --accent-line: #e0b3a6;
    --npr: #8c3520;
    --shadow: 0 24px 56px -30px rgba(40, 18, 12, .35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
    letter-spacing: -0.006em;
    display: grid; place-items: center; padding: 14px;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(680px 380px at 20% -10%, rgba(207, 75, 51, .13), transparent 62%);
  }
  .card {
    position: relative; width: 100%; max-width: 360px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 18px; padding: 20px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04), var(--shadow);
    text-align: center;
  }
  .head { display: flex; align-items: center; gap: 9px; text-align: left; margin-bottom: 16px; }
  .mark {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    background: rgba(207, 75, 51, .16); border: 1px solid var(--accent-line);
    display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--npr);
  }
  .head b { display: block; font-size: 12.5px; letter-spacing: -0.015em; }
  .head span { color: var(--faint); font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; }
  .amount {
    font-family: var(--mono); font-size: 34px; font-weight: 500; letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums; margin: 2px 0;
  }
  .amount small { font-size: 14px; color: var(--faint); letter-spacing: 0; margin-right: 6px; }
  .meta { color: var(--faint); font-size: 11.5px; margin-bottom: 14px; }
  .meta b { color: var(--muted); font-weight: 500; font-family: var(--mono); }
  .qr {
    background: #fff; border-radius: 14px; padding: 12px; display: inline-block;
    box-shadow: 0 18px 40px -24px rgba(0, 0, 0, .9);
    min-width: 216px; min-height: 216px;
  }
  .qr img { display: block; width: 216px; height: 216px; }
  .qr canvas { display: block; width: 216px; height: 216px; }
  .qr.placeholder {
    background: rgba(255, 255, 255, .03); border: 1px dashed var(--line-2);
    display: grid; place-items: center; color: var(--faint); font-size: 12px; padding: 20px;
  }
  .status {
    display: inline-flex; align-items: center; gap: 7px; margin-top: 14px;
    padding: 5px 11px; border-radius: 999px; font-size: 12px;
    border: 1px solid var(--line-2); color: var(--muted);
  }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .status.waiting .dot { background: var(--warn); animation: pulse 1.8s ease-in-out infinite; }
  .status.paid { border-color: var(--accent-line); color: var(--npr); }
  .status.paid .dot { background: var(--ok); }
  .status.error { border-color: #542a27; color: #ecc0bb; }
  .status.error .dot { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .35; } }
  .spin {
    display: inline-block; width: 11px; height: 11px; border: 2px solid var(--line-2);
    border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .detail { margin-top: 12px; font-size: 11.5px; color: var(--faint); line-height: 1.6; }
  .detail code { font-family: var(--mono); color: var(--muted); }
  .detail span { color: var(--faint); }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  button {
    flex: 1; height: 34px; border-radius: 9px; cursor: pointer; font: inherit; font-size: 12.5px;
    font-weight: 500; color: var(--text); background: rgba(255, 255, 255, .04);
    border: 1px solid var(--line-2);
    transition: background 180ms, border-color 180ms, transform 120ms;
  }
  button:hover { border-color: var(--accent); background: rgba(207, 75, 51, .1); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .paid-mark {
    width: 46px; height: 46px; margin: 0 auto 12px; border-radius: 50%;
    border: 1px solid var(--accent-line); background: rgba(207, 75, 51, .14);
    display: grid; place-items: center; color: var(--npr); font-size: 20px;
    animation: pop 320ms cubic-bezier(.2, .8, .3, 1) both;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.86); } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="head">
    <div class="mark">FP</div>
    <div><b>Scan to pay</b><span id="subject">Fonepay</span></div>
  </div>
  <div class="amount" id="amount"><small>NPR</small>—</div>
  <div class="meta" id="meta">&nbsp;</div>
  <div class="qr placeholder" id="qrBox"><span class="spin"></span></div>
  <div class="status waiting" id="status" role="status" aria-live="polite">
    <span class="dot"></span><span id="statusText">Preparing QR…</span>
  </div>
  <div class="detail" id="detail"></div>
  <div class="row"><button id="again" hidden>New QR</button></div>
</div>

<!--
  Fonepay hands back a QRCPS *payload*, not an image, so a QR encoder is needed to
  show it. The vendored copy is a plain script (no dependencies, no network).
-->
<script src="/vendor/qrcode.js"></script>
<script src="/fonepay.js"></script>
<script>
(function () {
  'use strict';

  const params = new URLSearchParams(location.search);
  const parentOrigin = params.get('origin') || '*';
  const pollMs = Number(params.get('poll') || 2500);

  const amount = Number(params.get('amount') || 0);
  const remarks = params.get('remarks') || '';
  const merchantId = params.get('merchant') || '';

  const $ = (id) => document.getElementById(id);
  const esc = (value) =>
    String(value === null || value === undefined ? '' : value).replace(/[&<>"]/g, (char) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[char],
    );

  if ((params.get('theme') || 'dark') === 'light') document.documentElement.dataset.theme = 'light';

  let client = null;
  let bridgeKey = null;
  let countdown = null;
  let qrCountdown = 0;

  function post(type, payload) {
    if (window.parent === window) return;
    window.parent.postMessage(Object.assign({ source: 'fonepay-pay', type: type }, payload || {}), parentOrigin);
  }

  window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data || data.source !== 'fonepay-host') return;
    if (data.type !== 'config' && data.type !== 'session') return;
    if (parentOrigin !== '*' && event.origin !== parentOrigin) return;
    if (data.bridgeKey) bridgeKey = data.bridgeKey;
    start(data.session);
  });

  function money(value) {
    return Number(value || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function setStatus(kind, text) {
    $('status').className = 'status ' + kind;
    $('statusText').textContent = text;
  }

  function showError(error) {
    setStatus('error', 'Could not create the QR');
    $('detail').innerHTML = esc((error && (error.help || error.message)) || 'Request failed.');
    post('error', { code: error && error.code, message: error && error.message, help: error && error.help });
  }

  /** Render a QRCPS payload into the card. */
  function renderQr(payload) {
    try {
      const qr = qrcode(0, 'M');
      qr.addData(payload);
      qr.make();
      $('qrBox').className = 'qr';
      $('qrBox').innerHTML = qr.createImgTag(4, 8);
      return true;
    } catch (error) {
      // Falls back to showing the payload, which any scanner app can read as text.
      $('qrBox').className = 'qr placeholder';
      $('qrBox').innerHTML = '<code style="word-break:break-all;font-size:10px">' + esc(payload) + '</code>';
      return false;
    }
  }

  function start(session) {
    if (!session) return;
    if (!client) {
      client = Fonepay.createClient({
        baseUrl: location.origin,
        session: session,
        bridgeKey: bridgeKey,
        onRenew: (fresh) => post('renewed', { session: fresh }),
      });
    } else {
      client.setSession(session);
    }
    makeQr();
  }

  function showPaid(status) {
    clearInterval(countdown);
    document.querySelector('.paid-mark')?.remove();
    $('card').insertAdjacentHTML('afterbegin', '<div class="paid-mark">✓</div>');
    $('qrBox').hidden = true;
    setStatus('paid', 'Payment received');
    const txn = status.transaction || {};
    $('detail').innerHTML =
      'Paid <b>' + money(txn.amount === undefined ? amount : txn.amount) + '</b>' +
      (txn.customerMobile ? ' · ' + esc(txn.customerMobile) : '') +
      '<br /><code>' + esc(txn.transactionId || status.collectId) + '</code>' +
      (status.matchedBy ? ' <span>matched by ' + esc(status.matchedBy) + '</span>' : '');
    $('again').hidden = false;
    post('paid', {
      amount: txn.amount === undefined ? amount : txn.amount,
      transactionId: txn.transactionId || null,
      customerMobile: txn.customerMobile || null,
      collectId: status.collectId,
      matchedBy: status.matchedBy || null,
      transaction: txn,
    });
  }

  async function makeQr() {
    $('again').hidden = true;
    $('amount').innerHTML = '<small>NPR</small>' + money(amount);
    $('subject').textContent = remarks || 'Fonepay';
    $('meta').innerHTML = merchantId ? 'Merchant <b>' + esc(merchantId) + '</b>' : '&nbsp;';
    $('detail').innerHTML = '';
    $('qrBox').hidden = false;
    $('qrBox').className = 'qr placeholder';
    $('qrBox').innerHTML = '<span class="spin"></span>';
    setStatus('waiting', 'Creating QR…');

    let handle;
    try {
      handle = await client.collect(amount, { remarks: remarks, merchantId: merchantId });
    } catch (error) {
      showError(error);
      return;
    }

    if (!handle || !handle.qrString) {
      showError({ message: 'Fonepay did not return a QR payload.' });
      return;
    }

    renderQr(handle.qrString);
    setStatus('waiting', 'Waiting for payment');
    $('detail').innerHTML = 'Reference <code>' + esc(handle.collectId) + '</code>';

    post('qr', {
      qrString: handle.qrString,
      amount: amount,
      collectId: handle.collectId,
      expiresAt: handle.expiresAt,
      keys: handle.keys,
    });

    clearInterval(countdown);
    qrCountdown = Math.max(0, Math.round((handle.expiresAt - Date.now()) / 1000));
    countdown = setInterval(() => {
      if (qrCountdown <= 0) return clearInterval(countdown);
      qrCountdown -= 1;
      if ($('status').className.indexOf('paid') === -1) {
        $('statusText').textContent = 'Waiting for payment · ' + qrCountdown + 's';
      }
    }, 1000);

    try {
      const paid = await client.waitForPaid(handle, {
        timeoutMs: Math.max(60000, handle.expiresAt - Date.now() + 15000),
        intervalMs: pollMs,
        onStatus: (status) =>
          post('status', {
            state: status.state,
            collectId: status.collectId,
            matchedBy: status.matchedBy || null,
            upstreamError: status.upstreamError || null,
          }),
      });
      showPaid(paid);
    } catch (error) {
      clearInterval(countdown);
      $('again').hidden = false;
      if (error && error.code === 'COLLECT_EXPIRED') {
        setStatus('error', 'QR expired');
        $('detail').innerHTML = 'Nobody scanned it in time. Generate a new QR to try again.';
      } else if (error && error.code === 'COLLECT_TIMEOUT') {
        setStatus('error', 'Stopped waiting');
        $('detail').innerHTML = 'No payment arrived. The QR may still be valid — press New QR to start over.';
      } else {
        setStatus('error', 'Could not check the payment');
        $('detail').innerHTML = esc((error && (error.help || error.message)) || 'Request failed.');
      }
      post('status', { state: 'STOPPED', error: error && error.code });
    }
  }

  $('again').addEventListener('click', () => {
    document.querySelector('.paid-mark')?.remove();
    $('qrBox').hidden = false;
    makeQr();
  });

  if (!amount || amount <= 0) {
    $('qrBox').className = 'qr placeholder';
    $('qrBox').innerHTML = '<span>Amount missing</span>';
    setStatus('error', 'Nothing to charge');
    $('detail').innerHTML = 'This page needs <code>?amount=</code>.';
    return;
  }

  $('qrBox').className = 'qr placeholder';
  $('qrBox').innerHTML = '<span>Waiting for session</span>';
  setStatus('waiting', 'Connecting…');
  $('detail').innerHTML = window.parent === window
    ? 'Open this page from your site.'
    : 'Handing over the session from the host page…';
  post('ready');
})();
</script>
</body>
</html>
