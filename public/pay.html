<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pay by QR · NepalPay</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
  :root {
    --bg: #0c1013;
    --panel: #12181d;
    --line: #1c242a;
    --line-2: #2a353d;
    --text: #e4eaee;
    --muted: #8b9aa4;
    --faint: #5d6b75;
    --accent: #2f9e88;
    --accent-line: #2b6d5e;
    --npr: #7fd7b6;
    --ok: #3fae7c;
    --warn: #d3a154;
    --bad: #d0615a;
    --shadow: 0 28px 64px -28px rgba(3, 10, 14, .85);
    --sans: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  :root[data-theme='light'] {
    --bg: #f6f7f6;
    --panel: #ffffff;
    --line: #e4e7e6;
    --line-2: #d3d8d7;
    --text: #16201f;
    --muted: #5c6a68;
    --faint: #8a9694;
    --accent: #1f8571;
    --accent-line: #9fd3c6;
    --npr: #16705d;
    --shadow: 0 24px 56px -30px rgba(16, 40, 36, .35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
    letter-spacing: -0.006em;
    display: grid; place-items: center; padding: 14px;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(680px 380px at 20% -10%, rgba(47, 158, 136, .13), transparent 62%);
  }

  .card {
    position: relative; width: 100%; max-width: 360px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 18px; padding: 20px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04), var(--shadow);
    text-align: center;
  }
  .head { display: flex; align-items: center; gap: 9px; text-align: left; margin-bottom: 16px; }
  .mark {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    background: rgba(47, 158, 136, .16); border: 1px solid var(--accent-line);
    display: grid; place-items: center; font-size: 11.5px; font-weight: 700; color: var(--npr);
  }
  .head b { display: block; font-size: 12.5px; letter-spacing: -0.015em; }
  .head span { color: var(--faint); font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; }

  .amount {
    font-family: var(--mono); font-size: 34px; font-weight: 500; letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums; margin: 2px 0 2px;
  }
  .amount small { font-size: 14px; color: var(--faint); letter-spacing: 0; margin-right: 6px; }
  .meta { color: var(--faint); font-size: 11.5px; margin-bottom: 14px; }
  .meta b { color: var(--muted); font-weight: 500; font-family: var(--mono); }

  .qr {
    background: #fff; border-radius: 14px; padding: 12px; display: inline-block;
    box-shadow: 0 18px 40px -24px rgba(0, 0, 0, .9);
    min-width: 216px; min-height: 216px;
  }
  .qr img { display: block; width: 216px; height: 216px; }
  .qr.placeholder {
    background: rgba(255, 255, 255, .03); border: 1px dashed var(--line-2);
    display: grid; place-items: center; color: var(--faint); font-size: 12px; padding: 20px;
  }

  .status {
    display: inline-flex; align-items: center; gap: 7px; margin-top: 14px;
    padding: 5px 11px; border-radius: 999px; font-size: 12px;
    border: 1px solid var(--line-2); color: var(--muted);
  }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .status.waiting .dot { background: var(--warn); animation: pulse 1.8s ease-in-out infinite; }
  .status.paid { border-color: var(--accent-line); color: var(--npr); }
  .status.paid .dot { background: var(--ok); }
  .status.error { border-color: #542a27; color: #ecc0bb; }
  .status.error .dot { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .35; } }

  .spin {
    display: inline-block; width: 11px; height: 11px; border: 2px solid var(--line-2);
    border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .detail { margin-top: 12px; font-size: 11.5px; color: var(--faint); line-height: 1.6; }
  .detail code { font-family: var(--mono); color: var(--muted); }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  button {
    flex: 1; height: 34px; border-radius: 9px; cursor: pointer; font: inherit; font-size: 12.5px;
    font-weight: 500; color: var(--text); background: rgba(255, 255, 255, .04);
    border: 1px solid var(--line-2);
    transition: background 180ms, border-color 180ms, transform 120ms;
  }
  button:hover { border-color: var(--accent); background: rgba(47, 158, 136, .1); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .paid-mark {
    width: 46px; height: 46px; margin: 0 auto 12px; border-radius: 50%;
    border: 1px solid var(--accent-line); background: rgba(47, 158, 136, .14);
    display: grid; place-items: center; color: var(--npr); font-size: 20px;
    animation: pop 320ms cubic-bezier(.2, .8, .3, 1) both;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.86); } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="head">
    <div class="mark">NP</div>
    <div><b>Scan to pay</b><span id="storeLabel">NepalPay</span></div>
  </div>
  <div class="amount" id="amount"><small>NPR</small>—</div>
  <div class="meta" id="meta">&nbsp;</div>
  <div class="qr placeholder" id="qrBox"><span class="spin"></span></div>
  <div class="status waiting" id="status" role="status" aria-live="polite">
    <span class="dot"></span><span id="statusText">Preparing QR…</span>
  </div>
  <div class="detail" id="detail"></div>
  <div class="row">
    <button id="again" hidden>New QR</button>
  </div>
</div>

<script src="/nepalpay.js"></script>
<script>
(function () {
  'use strict';

  const params = new URLSearchParams(location.search);
  const hashParams = new URLSearchParams(location.hash.replace(/^#/, ''));
  const parentOrigin = params.get('origin') || '*';
  const pollMs = Number(params.get('poll') || 5000);

  const amount = Number(params.get('amount') || 0);
  const storeLabel = params.get('store') || '';
  const terminal = params.get('terminal') || '';
  const remarks = params.get('remarks') || 'Web checkout';

  const $ = (id) => document.getElementById(id);
  const box = $('card');

  if ((params.get('theme') || 'dark') === 'light') document.documentElement.dataset.theme = 'light';

  let client = null;
  let known = new Set();
  let poller = null;
  let countdown = null;
  let qrCountdown = 0;

  /* ---------------- messaging with the host page ---------------- */

  function post(type, payload) {
    if (window.parent === window) return;
    window.parent.postMessage(Object.assign({ source: 'nepalpay-pay', type: type }, payload || {}), parentOrigin);
  }

  window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data || data.source !== 'nepalpay-host' || data.type !== 'session') return;
    if (parentOrigin !== '*' && event.origin !== parentOrigin) return;
    start(data.session);
  });

  /* ---------------- rendering ---------------- */

  function money(value) {
    return Number(value || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function setStatus(kind, text) {
    $('status').className = 'status ' + kind;
    $('statusText').textContent = text;
  }

  function showPlaceholder(text) {
    $('qrBox').className = 'qr placeholder';
    $('qrBox').innerHTML = '<span>' + text + '</span>';
  }

  function showError(error) {
    setStatus('error', error && error.code === 'UPSTREAM_BLOCKED' ? 'Bridge is blocked upstream' : 'Could not create the QR');
    $('detail').innerHTML = (error && (error.help || error.message)) || 'Request failed.';
    post('error', { code: error && error.code, message: error && error.message, help: error && error.help });
  }

  /* ---------------- flow ---------------- */

  function start(session) {
    if (!session) return;
    if (!client) {
      client = NepalPay.createClient({
        baseUrl: location.origin,
        session: session,
        onRenew: (fresh) => post('renewed', { session: fresh }),
      });
    } else {
      client.setSession(session);
    }
    makeQr();
  }

  async function makeQr() {
    $('again').hidden = true;
    $('amount').innerHTML = '<small>NPR</small>' + money(amount);
    $('storeLabel').textContent = storeLabel || 'Merchant';
    $('meta').innerHTML = 'Store <b>' + (storeLabel || '—') + '</b>' + (terminal ? ' · Terminal <b>' + terminal + '</b>' : '');
    $('detail').innerHTML = '';
    showPlaceholder('<span class="spin"></span>');
    $('qrBox').innerHTML = '<span class="spin"></span>';
    setStatus('waiting', 'Creating QR…');

    // Baseline first, so an already-existing payment is not mistaken for this one.
    try {
      const rows = await client.recentTransactions();
      known = new Set((Array.isArray(rows) ? rows : []).map((t) => t.instructionId).filter(Boolean));
    } catch (_) { /* non-fatal */ }

    let qr;
    try {
      qr = await client.createQr({ storeLabel: storeLabel, terminal: terminal, amount: amount, remarks: remarks });
    } catch (error) {
      showError(error);
      post('error', { code: error && error.code, message: error && error.message });
      return;
    }

    if (!qr || !qr.qrString) {
      showError({ message: 'NepalPay did not return a QR image.' });
      return;
    }

    $('qrBox').className = 'qr';
    $('qrBox').innerHTML = '<img alt="Payment QR code for NPR ' + money(amount) + '" src="' + qr.qrString + '" />';
    setStatus('waiting', 'Waiting for payment');
    $('detail').innerHTML = 'Reference <code>' + String(qr.validationTraceId || '') + '</code>';

    post('qr', { qrString: qr.qrString, amount: amount, validationTraceId: qr.validationTraceId });

    qrCountdown = Number(qr.qrProcessingTimer || 120);
    clearInterval(countdown);
    countdown = setInterval(() => {
      if (qrCountdown <= 0) return clearInterval(countdown);
      qrCountdown -= 1;
      if ($('status').className.indexOf('paid') === -1) {
        $('statusText').textContent = 'Waiting for payment · ' + qrCountdown + 's';
      }
    }, 1000);

    clearInterval(poller);
    poller = setInterval(check, pollMs);
    check();
  }

  async function check() {
    if (!client) return;
    try {
      const result = await NepalPay.paymentStatus(client, { ignore: known });
      if (!result.paid) {
        post('status', { paid: false, checked: result.checked });
        return;
      }
      clearInterval(poller);
      clearInterval(countdown);
      $('card').insertAdjacentHTML('afterbegin', '<div class="paid-mark">✓</div>');
      $('qrBox').hidden = true;
      setStatus('paid', 'Payment received');
      $('detail').innerHTML = 'Paid <b>' + money(result.transaction.amount) + '</b> · ' + (result.transaction.payerName || 'customer') +
        '<br /><code>' + String(result.transaction.instructionId || '') + '</code>';
      $('again').hidden = false;
      post('paid', {
        amount: result.transaction.amount,
        payerName: result.transaction.payerName,
        instructionId: result.transaction.instructionId,
        transaction: result.transaction,
      });
    } catch (error) {
      post('status', { paid: false, error: error && error.code });
    }
  }

  $('again').addEventListener('click', () => {
    document.querySelector('.paid-mark')?.remove();
    $('qrBox').hidden = false;
    makeQr();
  });

  /* ---------------- boot ---------------- */

  if (!amount || amount <= 0) {
    showPlaceholder('Amount missing');
    setStatus('error', 'Nothing to charge');
    $('detail').innerHTML = 'This page needs <code>?amount=</code> (and optionally <code>?store=</code>).';
    return;
  }
  if (amount > 2000000) {
    showPlaceholder('Amount too large');
    setStatus('error', 'Above the NepalPay limit');
    $('detail').innerHTML = 'The portal caps a QR at <code>2,000,000</code> NPR.';
    return;
  }

  // A session can arrive two ways: fragment (never sent to a server) or the host page.
  const fragment = hashParams.get('session');
  if (fragment) start(fragment);
  else {
    showPlaceholder('Waiting for session');
    setStatus('waiting', 'Connecting…');
    $('detail').innerHTML = window.parent === window
      ? 'Open this page from your site, or append <code>#session=…</code>.'
      : 'Handing over the session from the host page…';
    post('ready');
  }
})();
</script>
</body>
</html>
